<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Tamar</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .heart {
      position: absolute;
      color: red;
      font-size: 1.5rem;
      animation: float 5s ease-in-out infinite;
      opacity: 0.7;
    }

    @keyframes float {
      0% {
        transform: translateY(0);
        opacity: 0.7;
      }

      50% {
        transform: translateY(-100px);
        opacity: 0.3;
      }

      100% {
        transform: translateY(0);
        opacity: 0.7;
      }
    }

    .photo {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      transition: transform 0.3s;
    }

    .photo:hover {
      transform: scale(1.05);
    }
  </style>
</head>

<body class="bg-black text-white font-sans min-h-screen">

  <!-- Página inicial -->
  <main
    id="home"
    class="min-h-screen flex flex-col items-center justify-center text-center px-4"
  >
    <h1 class="text-4xl md:text-5xl font-bold mb-6">
      Tamar, clique aqui
    </h1>

    <button
      type="button"
      onclick="mostrarContador()"
      class="bg-red-600 text-white px-6 py-3 rounded-lg hover:bg-red-700 text-lg transition"
    >
      ❤️ Clique
    </button>
  </main>

  <!-- Conteúdo principal -->
  <section
    id="contadorSection"
    class="hidden w-full min-h-screen bg-black flex flex-col items-center justify-center py-8 px-4"
  >
    <div class="relative w-full max-w-3xl mx-auto p-4 bg-gray-900 bg-opacity-80 rounded-lg shadow-lg overflow-hidden">

      <!-- Corações -->
      <div
        id="heartContainer"
        class="absolute inset-0 pointer-events-none overflow-hidden"
      ></div>

      <!-- Conteúdo -->
      <div class="relative z-10">

        <div class="text-center mb-8">
          <h2 class="text-3xl md:text-4xl font-semibold text-pink-400">
            Eu te amo faz...
          </h2>

          <p id="contador" class="text-xl md:text-2xl mt-2"></p>
        </div>

        <!-- Galeria de fotos -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8">

          <!-- Seis novas fotos -->
          <img
            src="https://ibb.co/chVgDw9F"
            alt="Nova foto 1"
            class="photo rounded"
          >

          <img
            src="https://ibb.co/vCv77trm"
            alt="Nova foto 2"
            class="photo rounded"
          >

          <img
            src="https://ibb.co/DfPyHrK3"
            alt="Nova foto 3"
            class="photo rounded"
          >

          <img
            src="https://ibb.co/7tjbX87t"
            alt="Nova foto 4"
            class="photo rounded"
          >

          <img
            src="https://ibb.co/mV39vK3d"
            alt="Nova foto 5"
            class="photo rounded"
          >

          <img
            src="https://ibb.co/VWBdby1h"
            alt="Nova foto 6"
            class="photo rounded"
          >

          <!-- Quatro fotos antigas -->
          <img
            src="https://i.ibb.co/1tXR0Phz/3.jpg"
            alt="Foto 1"
            class="photo rounded"
          >

          <img
            src="https://i.ibb.co/yFtgyWjN/1.jpg"
            alt="Foto 2"
            class="photo rounded"
          >

          <img
            src="https://i.ibb.co/s98bdg4z/4.jpg"
            alt="Foto 3"
            class="photo rounded"
          >

          <img
            src="https://i.ibb.co/ZRQbdBFR/2.jpg"
            alt="Foto 4"
            class="photo rounded"
          >

        </div>

        <!-- Música -->
        <div class="flex flex-col items-center">
          <audio
            id="musica"
            controls
            loop
            preload="auto"
            class="w-full max-w-md"
          >
            <source src="./musica.mp3" type="audio/mpeg">
            Seu navegador não conseguiu reproduzir a música.
          </audio>

          <p
            id="audioStatus"
            class="hidden mt-3 text-sm text-pink-300 text-center"
          >
            Se a música não começou automaticamente, pressione o botão de reprodução acima.
          </p>
        </div>

      </div>
    </div>
  </section>

  <script>
    function mostrarContador() {
      document.getElementById("home").classList.add("hidden");

      const contadorSection =
        document.getElementById("contadorSection");

      contadorSection.classList.remove("hidden");

      // Inicia a música depois do clique.
      const musica = document.getElementById("musica");
      const audioStatus = document.getElementById("audioStatus");

      musica.volume = 0.7;

      musica.play().catch(function (erro) {
        console.warn("O navegador bloqueou a reprodução:", erro);
        audioStatus.classList.remove("hidden");
      });

      startContador();
      criarCoracoes();
    }

    function startContador() {
      const startDate = new Date("2024-06-08T17:00:00");

      function updateContador() {
        const now = new Date();
        const diff = now - startDate;

        const days = Math.floor(
          diff / (1000 * 60 * 60 * 24)
        );

        const hours = Math.floor(
          (diff % (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );

        const minutes = Math.floor(
          (diff % (1000 * 60 * 60)) /
          (1000 * 60)
        );

        const seconds = Math.floor(
          (diff % (1000 * 60)) / 1000
        );

        document.getElementById("contador").textContent =
          `${days} dias, ${hours} horas, ` +
          `${minutes} minutos e ${seconds} segundos`;
      }

      updateContador();
      setInterval(updateContador, 1000);
    }

    function criarCoracoes() {
      const heartContainer =
        document.getElementById("heartContainer");

      heartContainer.innerHTML = "";

      for (let i = 0; i < 15; i++) {
        const heart = document.createElement("span");

        heart.className = "heart";
        heart.textContent = "❤️";
        heart.style.left = `${Math.random() * 95}%`;
        heart.style.top = `${Math.random() * 90}%`;
        heart.style.animationDelay = `${Math.random() * 5}s`;

        heartContainer.appendChild(heart);
      }
    }
  </script>

</body>
</html>
